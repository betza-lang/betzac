name: betzac
version: 0.1.0.0
github: "betza-lang/betzac"
license: GPL-3
author: "Thierry Poulin"
maintainer: "thierry.poulin@icloud.com"
copyright: "2026 Thierry Poulin"

extra-source-files:
  - README.md
  - CHANGELOG.md

data-files:
  - prelude/std.betza

# Metadata used when publishing your package
synopsis:            Compiler of betza notation, a language for esoteric chess pieces
category:            Compiler, Game 

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: |
  Betzac is a compiler for betza notation, a description language for the movement
  of chess variant pieces. It handles multi-file projects with @using@ imports,
  label scoping and overrides, and a standard prelude of primitive leapers,
  reporting diagnostics the way a conventional compiler does.

  The package also provides @bls@, a Language Server Protocol implementation
  giving diagnostics, semantic highlighting and go-to-definition in any LSP editor.

  Please see the README on GitHub at <https://github.com/betza-lang/betzac#readme>

dependencies:
  - base >= 4.7 && < 5
  - transformers >= 0.6 && < 0.7
  - text >= 2.1 && < 2.2
  - lens >= 5.3 && < 5.4
  - lsp >= 2.7 && < 2.8
  - megaparsec >= 9.7 && < 9.8
  - containers >= 0.7 && < 0.8
  - directory >= 1.3 && < 1.4
  - filepath >= 1.5 && < 1.6

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

executables:
  betzac:
    main: Main.hs
    source-dirs: app/Betzac
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - betzac
      - optparse-applicative >= 0.18 && < 0.19
  bls:
    main: Main.hs
    source-dirs: app/Bls
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - betzac

tests:
  betzac-test:
    main: Spec.hs
    source-dirs: test/Betzac
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - hspec >= 2.11 && < 2.12
      - QuickCheck >= 2.15 && < 2.16
      - hedgehog >= 1.5 && < 1.6
      - hspec-hedgehog >= 0.3 && < 0.4
      - betzac
      - temporary >= 1.3 && < 1.4
      - directory
      - filepath
  bls-test:
    main: Spec.hs
    source-dirs: test/Bls
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - betzac
      - hspec >= 2.11 && < 2.12
      - lsp-test >= 0.17 && < 0.18
      - temporary >= 1.3 && < 1.4
      - directory
      - filepath
